# Đóng gói Dịch trên máy Windows của GitHub.
# Đẩy một tag dạng v1.0.0 lên GitHub => tự tạo Release kèm Dich-Setup.exe và Dich-portable.zip.
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller dich.spec --noconfirm

      - name: Self-test (OCR + translate)
        continue-on-error: true  # máy chủ GitHub có thể thiếu gói OCR
        shell: pwsh
        run: |
          Start-Process dist\Dich\Dich.exe -ArgumentList "--kiem-tra" -Wait
          Get-Content "$env:APPDATA\Dich\selftest.txt"

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d') { $version = "0.0.0" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\Dich -DestinationPath Output\Dich-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Dich
          path: Output/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/Dich-Setup.exe
            Output/Dich-portable.zip
